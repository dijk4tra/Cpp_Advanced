syntax = "proto3";

// 定义请求消息
message EchoRequest {
    string message = 1;
    string name = 2;
};

// 定义响应消息
message EchoResponse {
    string message = 1;
}

// 定义一个名字为 Example 的服务
service Example {
    // 定义一个名字叫 Echo 的 rpc
    rpc Echo(EchoRequest) returns (EchoResponse);
    // 一个 service（服务）中，可以定义多个 rpc 方法...
}
