# Input corpus paths.
# 英文关键词推荐语料目录，离线建库时扫描该目录生成英文词典和索引
en_corpus_dir=data/corpus/EN

# 中文关键词推荐语料目录，离线建库时扫描该目录生成中文词典和索引
cn_corpus_dir=data/corpus/CN

# 网页 XML 语料目录，离线建库时从其中提取网页库、偏移库和倒排索引
webpage_corpus_dir=data/corpus/webpages


# Stop words .
# 英文停用词文件，英文词典构建时用于过滤高频低信息量单词
en_stop_words=data/stopwords/en_stopwords.txt

# 中文停用词文件，中文词典构建和在线网页查询分词过滤都会使用
cn_stop_words=data/stopwords/cn_stopwords.txt

# 英文词典输出/加载路径，格式为 word frequency
en_dict=data/dict/dict_en.dat

# 中文词典输出/加载路径，格式为 word frequency
cn_dict=data/dict/dict_cn.dat

# 英文字符索引输出/加载路径，格式为 character lineNo...
en_dict_index=data/index/index_en.dat

# 中文字符索引输出/加载路径，格式为 character lineNo...
cn_dict_index=data/index/index_cn.dat


# Web search offline data.
# 网页库文件路径，保存离线提取和去重后的 <doc> 记录
pages=data/index/pages.dat

# 网页偏移库文件路径，保存 docId 在 pages.dat 中的 offset 和 length
offsets=data/index/offsets.dat

# 网页倒排索引文件路径，格式为 word docId weight...
invert_index=data/index/invert_index.dat



# Online server.
# 在线服务监听 IP0.0.0.0 表示接受本机和局域网网卡上的连接
server_ip=0.0.0.0

# TLV 协议服务端口，供课程要求的二进制 TLV 客户端访问
server_port=8888

# HTTP 服务端口，供浏览器访问 www 前端页面和 /api 接口
http_port=18888

# TLV 服务 muduo 工作线程数，用于处理搜索协议客户端连接
io_threads=4

# HTTP 服务 muduo 工作线程数，用于处理浏览器静态文件和 JSON API 请求
http_threads=2

# 单条 TLV 消息 value 的最大字节数，超过该值会返回协议错误
max_message_size=1048576

# 关键字推荐返回数量：HTTP 接口固定使用该值；TLV 请求未传 topk 时使用该默认值
keyword_topk=10

# 网页搜索返回数量：HTTP 接口固定使用该值；TLV 请求未传 topk 时使用该默认值
web_topk=33

# 动态摘要默认字符数上限，在线搜索结果的 abstract 字段使用该长度
abstract_length=200

# 浏览器前端静态资源目录，HTTP 根路径会映射到该目录下的 index.html
www_root=www
