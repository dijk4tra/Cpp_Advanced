# Input corpus paths.
# 英文关键词推荐语料目录，离线建库时扫描该目录生成英文词典和索引
en_corpus_dir=data/corpus/EN

# 中文关键词推荐语料目录，离线建库时扫描该目录生成中文词典和索引
cn_corpus_dir=data/corpus/CN

# 网页 XML 语料目录，离线建库时从其中提取网页库、偏移库和倒排索引
webpage_corpus_dir=data/corpus/webpages


# Stop words .
# 英文停用词文件，英文词典构建时用于过滤高频低信息量单词
en_stop_words=data/stopwords/en_stopwords.txt

# 中文停用词文件，中文词典构建和在线网页查询分词过滤都会使用
cn_stop_words=data/stopwords/cn_stopwords.txt

# 英文词典输出/加载路径，格式为 word frequency
en_dict=data/dict/dict_en.dat

# 中文词典输出/加载路径，格式为 word frequency
cn_dict=data/dict/dict_cn.dat

# 英文字符索引输出/加载路径，格式为 character lineNo...
en_dict_index=data/index/index_en.dat

# 中文字符索引输出/加载路径，格式为 character lineNo...
cn_dict_index=data/index/index_cn.dat


# Web search offline data.
# 网页库文件路径，保存离线提取和去重后的 <doc> 记录
pages=data/index/pages.dat

# 网页偏移库文件路径，保存 docId 在 pages.dat 中的 offset 和 length
offsets=data/index/offsets.dat

# 网页倒排索引文件路径，格式为 word docId weight...
invert_index=data/index/invert_index.dat



# Online server.
# 在线服务监听 IP0.0.0.0 表示接受本机和局域网网卡上的连接
server_ip=0.0.0.0

# TLV 协议服务端口，供课程要求的二进制 TLV 客户端访问
server_port=8888

# HTTP 服务端口，供浏览器访问 www 前端页面和 /api 接口
http_port=18888

# TLV 服务 muduo 工作线程数，用于处理搜索协议客户端连接
io_threads=4

# HTTP 服务 muduo 工作线程数，用于处理浏览器静态文件和 JSON API 请求
http_threads=2

# 单条 TLV 消息 value 的最大字节数，超过该值会返回协议错误
max_message_size=1048576

# 关键字推荐返回数量：HTTP 接口固定使用该值；TLV 请求未传 topk 时使用该默认值
keyword_topk=10

# 网页搜索返回数量：HTTP 接口固定使用该值；TLV 请求未传 topk 时使用该默认值
web_topk=33

# 动态摘要默认字符数上限，在线搜索结果的 abstract 字段使用该长度
abstract_length=200

# 浏览器前端静态资源目录，HTTP 根路径会映射到该目录下的 index.html
www_root=www


# Cache.
# 是否启用缓存总开关，0 表示完全关闭缓存
cache_enabled=1

# 缓存版本，离线数据重建后应更新，避免命中旧数据结果
cache_version=search_engine_v3_001

# 是否启用进程内 L1 本地缓存
l1_cache_enabled=1

# L1 本地缓存总容量，按 key 数量计
l1_cache_capacity=4096

# L1 本地缓存分片数，用于降低多线程锁竞争
l1_cache_shards=32

# L1 淘汰策略：wtinylfu 使用完整 W-TinyLFU；lru 可回退到原分片 LRU
l1_cache_policy=wtinylfu

# Window LRU 占每个分片容量的百分比，内部会限制到 1~99
l1_wtinylfu_window_percent=1

# Main Protected 的容量上限占 Main 的百分比，内部会限制到 1~99
l1_wtinylfu_protected_percent=80

# 每累计“分片容量 × 此倍数”次访问后，将 Count-Min Sketch 计数减半并清空 Doorkeeper
l1_wtinylfu_frequency_sample_multiplier=10

# 普通结果缓存秒数，小于等于 0 表示不过期
l1_cache_ttl_seconds=600

# 空结果缓存秒数，避免不存在 query 反复回源
l1_empty_ttl_seconds=60

# 缓存 TTL 随机抖动秒数，用于避免大量 key 同时过期
cache_ttl_jitter_seconds=30

# 文档展示信息缓存秒数，用于缓存按需从 pages.dat 读取出的热点文档
document_cache_ttl_seconds=600

# 动态摘要片段缓存秒数，摘要依赖 docId、查询关键词和摘要长度
abstract_cache_ttl_seconds=600

# 每处理多少次搜索/推荐请求打印一次缓存统计，0 表示关闭统计日志
cache_stats_log_interval=100

# 是否启用 Redis L2 缓存；默认关闭，Redis 不可用时服务仍可走 L1 和原搜索流程
redis_cache_enabled=1

# Redis 地址，本项目按本机 Redis 服务设计
redis_host=127.0.0.1

# Redis 端口
redis_port=6379

# Redis DB 编号
redis_db=0

# Redis 建连超时毫秒数
redis_connect_timeout_ms=20

# Redis 命令读写超时毫秒数
redis_command_timeout_ms=20

# Redis 命中后回填 L1 的 TTL
redis_l1_backfill_ttl_seconds=600
