# SearchEngine V3.1 统一配置
#
# 快速导航：
#   [01] 离线建库 - 输入语料与停用词
#   [02] 离线产物 - 词典、索引、网页库与 BM25 统计
#   [03] 检索与返回结果 - BM25、topK 与摘要
#   [04] TLV 服务 - 监听地址、端口、线程与消息限制
#   [05] HTTP 服务 - 端口、线程、请求限制与静态资源
#   [06] 日志 - spdlog、muduo、滚动与慢请求
#   [07] 缓存总控 - 开关、版本、TTL 与统计
#   [08] L1 进程内缓存 - 容量、分片和淘汰策略
#   [09] Redis L2 - 连接、超时、连接池与回填
#
# 通用约定：
#   - 开关类配置：1=开启，0=关闭。
#   - 时间单位在 key 中标明：_seconds=秒，_ms=毫秒。
#   - 路径为相对项目运行目录的路径。
#   - 配置解析器支持空行和整行 # 注释，不支持行尾注释。


# =============================================================================
# [01] 离线建库：输入语料与停用词
# 使用者：offline_builder / KeywordProcessor / PageProcessor
# =============================================================================

# 英文关键词推荐语料目录
en_corpus_dir=data/corpus/EN

# 中文关键词推荐语料目录
cn_corpus_dir=data/corpus/CN

# 网页 XML 语料目录，用于生成网页库、偏移库和 BM25 索引
webpage_corpus_dir=data/corpus/webpages

# 英文停用词，用于英文词典建库
en_stop_words=data/stopwords/en_stopwords.txt

# 中文停用词，离线建库和在线查询分词共用
cn_stop_words=data/stopwords/cn_stopwords.txt


# =============================================================================
# [02] 离线产物：词典、索引、网页库与 BM25 统计
# 生成者：offline_builder；使用者：search_server
# 重建下列数据后，同时更新 [07] cache_version。
# =============================================================================

# 英文词典，格式：word frequency
en_dict=data/dict/dict_en.dat

# 中文词典，格式：word frequency
cn_dict=data/dict/dict_cn.dat

# 英文字符索引，格式：character lineNo...
en_dict_index=data/index/index_en.dat

# 中文字符索引，格式：character lineNo...
cn_dict_index=data/index/index_cn.dat

# 去重后的网页库，保存 <doc> 记录
pages=data/index/pages.dat

# 网页偏移库，保存 docId 在 pages.dat 中的 offset 和 length
offsets=data/index/offsets.dat

# BM25 倒排索引，格式：word df docId tf...
invert_index=data/index/invert_index.dat

# BM25 文档统计：首行保存格式版本、N、avgdl，后续保存 docId 和 dl
bm25_doc_stats=data/index/bm25_doc_stats.dat


# =============================================================================
# [03] 检索与返回结果
# 使用者：WebSearcher / KeywordRecommender
# =============================================================================

# BM25 词频饱和参数，必须大于 0
bm25_k1=1.5

# BM25 文档长度归一化参数，范围 0~1
bm25_b=0.75

# 关键词推荐数量；HTTP 固定使用，TLV 未传 topk 时作为默认值
keyword_topk=10

# 网页搜索结果数量；HTTP 固定使用，TLV 未传 topk 时作为默认值
web_topk=33

# 动态摘要最大字符数
abstract_length=200


# =============================================================================
# [04] TLV 服务
# 使用者：SearchServer
# =============================================================================

# 在线服务监听 IP；0.0.0.0 表示接受所有本机网卡的连接
server_ip=0.0.0.0

# TLV 协议服务端口
server_port=8888

# TLV 服务 muduo 工作线程数
io_threads=4

# 单条 TLV 消息 value 的最大字节数
max_message_size=1048576


# =============================================================================
# [05] HTTP 服务
# 使用者：WebHttpServer
# =============================================================================

# HTTP 服务端口，用于浏览器页面和 /api 接口
http_port=18888

# HTTP muduo 工作线程数；应结合 CPU 和真实负载测试 2/4/8，并非越大越好
http_threads=8

# HTTP 请求头与 body 的最大总字节数
http_max_request_size=1048576

# 浏览器前端静态资源目录，根路径映射到该目录的 index.html
www_root=www


# =============================================================================
# [06] 日志与慢请求
# spdlog 同时输出到控制台和滚动文件。
# INFO 不记录普通逐连接/逐请求；调试时可改为 debug。
# =============================================================================

# spdlog 级别：trace / debug / info / warn / error / critical / off
log_level=info

# 日志目录：生成 offline_builder.log 和 search_server.log
log_dir=logs

# 单个日志文件达到该 MiB 后滚动
log_max_file_size_mb=20

# 最多保留的滚动文件数，包含当前文件
log_max_files=5

# spdlog 异步队列容量；队列满时阻塞，不丢弃错误日志
log_async_queue_size=8192

# muduo 框架日志级别；WARN 可关闭 TcpServer 逐连接 INFO
muduo_log_level=WARN

# HTTP/TLV 请求超过该毫秒数时记录 WARN，普通请求只在 DEBUG 记录
slow_request_ms=200


# =============================================================================
# [07] 缓存总控、TTL 与统计
# 使用者：CachedSearchService / WebSearcher
# =============================================================================

# 缓存总开关；关闭后不组装 L1/L2 搜索结果缓存
cache_enabled=1

# 缓存命名空间版本；离线数据重建或结果格式变更后必须更新
cache_version=search_engine_v3_003_bm25

# 普通搜索/推荐结果 TTL；<=0 表示不过期
l1_cache_ttl_seconds=600

# 空结果 TTL，通常应短于普通结果 TTL
l1_empty_ttl_seconds=60

# TTL 随机增加 0~该秒数，避免大量 key 同时过期
cache_ttl_jitter_seconds=30

# 文档展示信息 TTL，用于缓存从 pages.dat 按需读取的文档
document_cache_ttl_seconds=600

# 动态摘要 TTL；摘要缓存同时区分 docId、查询词和摘要长度
abstract_cache_ttl_seconds=600

# 每处理该数量的搜索/推荐请求输出一次缓存统计；0 表示关闭
cache_stats_log_interval=100


# =============================================================================
# [08] L1 进程内缓存
# 注意：总容量会分配到各分片，容量/分片数不宜过小。
# =============================================================================

# L1 独立开关；生效前提是 [07] cache_enabled=1
l1_cache_enabled=1

# L1 总容量，按 key 数量计
l1_cache_capacity=4096

# L1 分片数，用于降低多线程锁竞争
l1_cache_shards=32

# 淘汰策略：wtinylfu 或 lru
l1_cache_policy=wtinylfu

# W-TinyLFU Window LRU 占每个分片容量的百分比，内部限制为 1~99
l1_wtinylfu_window_percent=1

# W-TinyLFU Main Protected 占 Main 容量上限的百分比，内部限制为 1~99
l1_wtinylfu_protected_percent=80

# 每累计“分片容量 × 该倍数”次访问后，Count-Min Sketch 计数减半并清空 Doorkeeper
l1_wtinylfu_frequency_sample_multiplier=10


# =============================================================================
# [09] Redis L2 缓存与持久连接池
# Redis 不可用时会降级到 L1/回源，不作为唯一数据源。
# =============================================================================

# Redis L2 开关；生效前提是 [07] cache_enabled=1
redis_cache_enabled=1

# Redis 服务地址和端口
redis_host=127.0.0.1
redis_port=6379

# Redis DB 编号
redis_db=0

# 新建 Redis TCP 连接超时
redis_connect_timeout_ms=20

# Redis 命令读写超时
redis_command_timeout_ms=20

# 持久连接池最大连接数，应覆盖 HTTP/TLV 工作线程的并发缓存访问
redis_pool_size=16

# 连接池耗尽时等待空闲连接的最长时间，超时后按缓存未命中降级
redis_pool_wait_timeout_ms=20

# Redis 命中结果回填 L1 时使用的 TTL
redis_l1_backfill_ttl_seconds=600
